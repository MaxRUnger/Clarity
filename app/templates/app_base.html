<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Project Clarity{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='js/student_names.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/ui_helpers.js') }}?v=4"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 transition-colors">

        <div class="max-w-[1600px] mx-auto px-8 py-3">
            <div class="flex items-center gap-8">

                {% if (class_id is defined and class_id) and session.get('role') == 'instructor' %}
                <div class="flex gap-1 flex-1">
                    <!-- Dashboard -->
                    <a href="{{ url_for('main.class_detail', class_id=class_id) }}" class="flex items-center gap-1.5 px-3 py-2 rounded-md text-sm {% if request.endpoint == 'main.class_detail' %}bg-blue-600 text-white{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %} transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                        Dashboard

                    <!-- Assignments -->

                        Assignments
                    </a>
                    <!-- Upload Grades -->
                    <a href="{{ url_for('main.upload_grades', class_id=class_id) }}" class="flex items-center gap-1.5 px-3 py-2 rounded-md text-sm {% if request.endpoint == 'main.upload_grades' %}bg-blue-600 text-white{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %} transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        Upload Grades
                    </a>
                    <!-- Speed Grader -->
                    <a href="{{ url_for('main.class_speed_grader', class_id=class_id) }}" class="flex items-center gap-1.5 px-3 py-2 rounded-md text-sm {% if request.endpoint == 'main.class_speed_grader' %}bg-blue-600 text-white{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %} transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        Speed Grader
                    </a>
                    <!-- Student Progress -->
                    <a href="{{ url_for('main.class_students', class_id=class_id) }}" class="flex items-center gap-1.5 px-3 py-2 rounded-md text-sm {% if request.endpoint == 'main.class_students' %}bg-blue-600 text-white{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %} transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        Student Progress
                    </a>
                    <!-- Reports -->
                    <a href="{{ url_for('main.class_reports', class_id=class_id) }}" class="flex items-center gap-1.5 px-3 py-2 rounded-md text-sm {% if request.endpoint == 'main.class_reports' %}bg-blue-600 text-white{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700{% endif %} transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        Reports
                    </a>
                </div>
                {% endif %}
                
                <div class="relative ml-auto" id="menuContainer">
                    <button type="button" id="menuBtn" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors" aria-label="Menu">
                        <svg class="w-5 h-5 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                    <div id="menuDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg py-2 z-50">
                        <button type="button" id="themeBtn" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                            <svg id="iconSun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                            <svg id="iconMoon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                            <span id="themeLabel">Dark Mode</span>
                        </button>
                        <a href="{{ url_for('main.support') }}" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Support & Help
                        </a>
                        <div class="border-t border-slate-200 dark:border-slate-700 my-2"></div>
                        <a href="{{ url_for('main.logout') }}" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Log Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function() {
            const stored = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            const themeBtn = document.getElementById('themeBtn');
            const themeLabel = document.getElementById('themeLabel');
            themeBtn?.addEventListener('click', function() {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
            });
            const isDark = document.documentElement.classList.contains('dark');
            if (themeLabel) themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
            const menuBtn = document.getElementById('menuBtn');
            const menuDropdown = document.getElementById('menuDropdown');
            menuBtn?.addEventListener('click', function(e) {
                e.stopPropagation();
                menuDropdown?.classList.toggle('hidden');
            });
            document.addEventListener('click', function() {
                menuDropdown?.classList.add('hidden');
            });
        })();

        function copyTextShowFeedback(button) {
            if (!button) return;
            var label = button.getAttribute('data-label-copied') || 'Copied';
            var prev = button.getAttribute('aria-label');
            button.setAttribute('aria-label', label);
            clearTimeout(button._copyResetTimer);
            button._copyResetTimer = setTimeout(function () {
                if (prev) button.setAttribute('aria-label', prev);
            }, 1600);
        }

        /** Read email from data-email (avoids broken strings in inline onclick). */
        function copyEmailFromBtn(button) {
            if (!button) return;
            var text = button.getAttribute('data-email');
            if (text == null) text = '';
            copyTextToClipboard(String(text), button);
        }

        // The Async Clipboard API is gated by the browser to "secure contexts"
        // only (https, plus a small allowlist of dev hosts). On a LAN dev
        // server, http://192.168.x.x is *not* a secure context and the API
        // silently rejects, so we short-circuit and fall through to the
        // legacy execCommand path below instead of showing a copy that did
        // nothing.
        function copyTextClipboardApi(text, button) {
            if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') return;
            var h = (location.hostname || '').toLowerCase();
            var allow = window.isSecureContext || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h.endsWith('.localhost');
            if (!allow) return;
            navigator.clipboard.writeText(text).then(function () {
                copyTextShowFeedback(button);
            }).catch(function () {});
        }

        // Fallback path. Browsers will only honor `document.execCommand('copy')`
        // when it runs synchronously inside a user-initiated event handler, so
        // we deliberately try several DOM strategies in the same call stack
        // and bail on the first one that works rather than awaiting any
        // promise. The four `tryOne` variants exist because different browser
        // / OS combos refuse one or another (Safari hates contentEditable
        // divs, mobile Chrome hates off-screen textareas with width:1px, etc).
        function copyTextViaExecCommand(text) {
            text = String(text || '');
            if (!text) return false;

            function tryOne(makeEl, selectFn) {
                var el = makeEl();
                document.body.appendChild(el);
                var ok = false;
                try {
                    selectFn(el);
                    ok = document.execCommand('copy');
                } catch (err) {}
                if (el.parentNode) el.parentNode.removeChild(el);
                return ok;
            }

            var style = 'position:fixed;top:0;left:0;width:24px;height:24px;padding:4px;margin:0;border:1px solid transparent;outline:0;opacity:0.02;z-index:2147483647;font-size:12px;line-height:1.2;';

            if (tryOne(function () {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = style;
                return ta;
            }, function (el) {
                el.focus();
                el.select();
                el.setSelectionRange(0, text.length);
            })) return true;

            if (tryOne(function () {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = style;
                return ta;
            }, function (el) {
                el.focus();
                el.select();
            })) return true;

            if (tryOne(function () {
                var div = document.createElement('div');
                div.contentEditable = 'true';
                div.textContent = text;
                div.style.cssText = style + 'white-space:pre-wrap;overflow:hidden;';
                return div;
            }, function (el) {
                el.focus();
                var r = document.createRange();
                r.selectNodeContents(el);
                var s = window.getSelection();
                if (s) {
                    s.removeAllRanges();
                    s.addRange(r);
                }
            })) return true;

            if (tryOne(function () {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;padding:0;margin:0;border:0;opacity:0;';
                return ta;
            }, function (el) {
                el.focus();
                el.select();
            })) return true;

            return false;
        }

        function copyTextToClipboard(text, button) {
            text = String(text == null ? '' : text);
            if (!text) return;

            if (copyTextViaExecCommand(text)) {
                copyTextShowFeedback(button);
                return;
            }
            copyTextClipboardApi(text, button);
        }

        // Add CSRF token to mutating fetch requests and regular forms.
        (function setupCsrfClientHelpers() {
            function csrfToken() {
                var m = document.querySelector('meta[name="csrf-token"]');
                return m ? String(m.getAttribute('content') || '') : '';
            }

            function ensureCsrfOnForm(form) {
                if (!form || form.tagName !== 'FORM') return;
                var method = String(form.getAttribute('method') || 'GET').toUpperCase();
                if (['POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) < 0) return;
                if (form.querySelector('input[name="csrf_token"]')) return;
                var token = csrfToken();
                if (!token) return;
                var hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.name = 'csrf_token';
                hidden.value = token;
                form.appendChild(hidden);
            }

            var originalFetch = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                init.headers = init.headers || {};
                var token = csrfToken();
                var method = String((init.method || 'GET')).toUpperCase();
                if (token && ['POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) >= 0) {
                    if (init.headers instanceof Headers) {
                        if (!init.headers.has('X-CSRF-Token')) init.headers.set('X-CSRF-Token', token);
                    } else if (!init.headers['X-CSRF-Token']) {
                        init.headers['X-CSRF-Token'] = token;
                    }
                }
                return originalFetch(input, init);
            };

            // Native form.submit() does not fire the submit event, so also
            // inject CSRF for programmatic submits (e.g. Create Objective).
            var originalFormSubmit = HTMLFormElement.prototype.submit;
            HTMLFormElement.prototype.submit = function () {
                ensureCsrfOnForm(this);
                return originalFormSubmit.call(this);
            };

            document.addEventListener('submit', function (evt) {
                ensureCsrfOnForm(evt.target);
            }, true);
        })();

        // Print helper: remove standalone dash placeholders so paper copies
        // have blank cells teachers can fill by hand.
        (function setupPrintPlaceholderCleanup() {
            var originals = [];
            var DASH_ONLY = /^[-–—]\s*$/;

            function clearDashPlaceholdersForPrint() {
                if (originals.length) return;
                var root = document.querySelector('main') || document.body;
                if (!root) return;
                var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                var node;
                while ((node = walker.nextNode())) {
                    var value = String(node.nodeValue || '');
                    if (!value.trim()) continue;
                    if (!DASH_ONLY.test(value.trim())) continue;
                    var parent = node.parentElement;
                    if (!parent) continue;
                    var tag = (parent.tagName || '').toUpperCase();
                    if (!['TD', 'TH', 'SPAN', 'DIV', 'P'].includes(tag)) continue;
                    originals.push([node, value]);
                    node.nodeValue = value.replace(/[-–—]/g, ' ');
                }
            }

            function restoreDashPlaceholdersAfterPrint() {
                for (var i = 0; i < originals.length; i++) {
                    originals[i][0].nodeValue = originals[i][1];
                }
                originals = [];
            }

            window.addEventListener('beforeprint', clearDashPlaceholdersForPrint);
            window.addEventListener('afterprint', restoreDashPlaceholdersAfterPrint);
        })();
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
