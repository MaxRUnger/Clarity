{% extends "auth_base.html" %}

{% block content %}
<div class="flex-1 flex items-center justify-center p-8">
  <div class="w-full max-w-md">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8">

      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-1">Forgot password</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">We will email a reset link if an instructor account exists for that address.</p>
      </div>

      <div id="errorBanner" class="hidden flex items-start gap-3 px-4 py-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl mb-5">
        <p id="errorText" class="text-sm text-red-700 dark:text-red-400"></p>
      </div>

      <p id="sentNotice" class="hidden mb-5 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900 dark:border-amber-700 dark:bg-amber-900/40 dark:text-amber-100"></p>

      <form onsubmit="submitForgot(event)" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
          <input type="email" id="email" required
            placeholder="your.email@university.edu"
            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>

        <button type="submit"
          class="w-full flex items-center justify-center gap-2 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-sm transition-all shadow-sm shadow-blue-500/20 mt-2">
          Send reset link
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
        <a href="/login" class="text-blue-600 dark:text-blue-400 hover:underline font-medium">Back to sign in</a>
      </p>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function submitForgot(event) {
  event.preventDefault();
  var errorBanner = document.getElementById("errorBanner");
  var errorText = document.getElementById("errorText");
  var sentNotice = document.getElementById("sentNotice");
  errorBanner.classList.add("hidden");
  sentNotice.classList.add("hidden");
  var btn = event.target.querySelector("button[type=submit]");
  var orig = btn.innerHTML;
  btn.disabled = true;
  fetch("/api/forgot-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: document.getElementById("email").value })
  })
  .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
  .then(function (res) {
    btn.disabled = false;
    btn.innerHTML = orig;
    if (res.status === 200 && res.body && res.body.success) {
      sentNotice.textContent = res.body.message || "If an instructor account exists for that address, a reset message is on its way.";
      sentNotice.classList.remove("hidden");
      return;
    }
    errorText.textContent = (res.body && (res.body.message || res.body.error)) || "Request failed. Please try again.";
    errorBanner.classList.remove("hidden");
  })
  .catch(function () {
    btn.disabled = false;
    btn.innerHTML = orig;
    errorText.textContent = "Connection error. Please try again.";
    errorBanner.classList.remove("hidden");
  });
}
</script>
{% endblock %}
